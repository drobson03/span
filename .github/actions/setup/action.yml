name: Setup
description: Install pnpm, Node.js and dependencies.
runs:
  using: composite
  steps:
    # Version comes from `packageManager` in package.json.
    - uses: pnpm/action-setup@v6
    # No pnpm store cache: restoring the ~260 MB archive is slower than a cold
    # install from the registry, and saving it on a miss adds ~12s.
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        package-manager-cache: false
    - run: pnpm install --frozen-lockfile
      shell: bash
